[project]
name = "quant-capstone"
version = "0.1.0"
description = "Cross-sectional, market-neutral, short-term reversal equity strategy with an honest cost model."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1,<3",
    "pandas>=2.2,<3",
    "scipy>=1.14,<2",
    "scikit-learn>=1.5,<2",
    "statsmodels>=0.14,<0.15",
    "yfinance>=0.2.54,<0.3",
    "pyarrow>=17,<20",
    "matplotlib>=3.9,<4",
    "lxml>=5,<6",
    "ibapi>=9.81.1.post1",
]

[project.optional-dependencies]
# vectorbt pulls a heavy/pinned dependency tree; keep it out of the default env.
crosscheck = ["vectorbt>=0.26,<0.27"]

[project.scripts]
quant-capstone = "quant_capstone.cli:main"

[dependency-groups]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_capstone"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
